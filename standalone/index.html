<script>
(() => {
"use strict";
const COLORS={RED:{label:"Red",css:"#f76565"},BLUE:{label:"Blue",css:"#66aafa"},GREEN:{label:"Green",css:"#55c786"},YELLOW:{label:"Yellow",css:"#f6d34f"},ORANGE:{label:"Orange",css:"#f59245"},PURPLE:{label:"Purple",css:"#ae75ed"}};

function nameProblem(value){const n=cleanName(value);if(!n)return"Enter a first name or nickname to continue.";if(n.length>18)return"Use 18 characters or fewer.";if(!/^[\p{L}\p{N} ._'’-]+$/u.test(n))return"Use letters, numbers, spaces, periods, hyphens or apostrophes only.";if(/@|https?:\/\/|www\.|(?:\+?\d[\d ()-]{6,}\d)/iu.test(n))return"Use a first name or nickname only, without emails, phone numbers or IDs.";if(/\b(?:employee|emp|staff|worker|associate|id|eid)[-_ ]?\d{4,}\b/iu.test(n))return"Use a first name or nickname only, not an employee ID.";if(/\b(?:fuck|shit|bitch|asshole|cunt|nigger|faggot)\b/iu.test(n))return"Choose a different nickname.";return""}

function compare(a,b){return b.score-a.score||b.bestStreak-a.bestStreak||b.accuracy-a.accuracy||a.avg-b.avg||a.name.localeCompare(b.name)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function tier(s){return s>=20?"UNSTOPPABLE":s>=15?"LASER FOCUS":s>=10?"IN THE ZONE":s>=5?"SHARP":"FOCUSED"}
function nextRule(){const r=state.ruleState;if(!r.queue.length){const base=[false,false,false,false,false,false,false,true,true,true];let candidate;for(let i=0;i<80;i++){candidate=[...base].sort(()=>Math.random()-.5);let last=r.last,n=r.count,ok=true;for(const x of candidate){n=x===last?n+1:1;last=x;if(n>4){ok=false;break}}if(ok)break}r.queue=candidate||[false,false,true,false,false,true,false,false,true,false]}const shifted=r.queue.shift()??false,changed=r.last!==null&&r.last!==shifted;r.count=r.last===shifted?r.count+1:1;r.last=shifted;return{shifted,changed}}
function makeRound(rule){const word=COLOR_NAMES[Math.floor(Math.random()*6)],elapsed=state.elapsed,matchChance=Math.max(.2,.35-Math.min(60,elapsed)/60*.15),color=Math.random()<matchChance?word:COLOR_NAMES.filter(c=>c!==word)[Math.floor(Math.random()*5)],correct=rule.shifted?word:color,count=Math.min(6,4+Math.floor(Math.min(2,elapsed/20))),options=[correct,...COLOR_NAMES.filter(c=>c!==correct).sort(()=>Math.random()-.5).slice(0,count-1)].sort(()=>Math.random()-.5),windowMs=Math.max(1700,3000-Math.min(60,elapsed)/60*1300);return{word,color,shifted:rule.shifted,changed:rule.changed,options,promptAt:elapsed*1000,deadline:elapsed*1000+windowMs}}
function tone(kind){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=tone.ctx||(tone.ctx=new C()),o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==="incorrect"?"triangle":"sine";o.frequency.value=kind==="correct"?720:kind==="incorrect"?220:kind==="moment"?980:kind==="timeout"?150:460;g.gain.value=.035;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.11)}catch{}}
function speak(text,rule=false){if(!(rule?state.voice:state.coach)||!("speechSynthesis"in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=1.16;speechSynthesis.speak(u)}catch{}}
function renderHome(){const name=state.name;app.innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><span class="mark" aria-hidden="true"></span>flash focus</div><div class="actions"><button class="icon" data-action="sound" aria-label="${state.sound?"Mute sound":"Turn on sound"}" aria-pressed="${state.sound}" title="Sound">${state.sound?"♪":"×"}</button><button class="icon" data-action="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button><button class="secondary" data-action="help" aria-haspopup="dialog">How to play</button></div></header><main class="landing"><section class="hero-copy"><span class="eyebrow">Arcade Game</span><h1 class="display">FLASH <em>FOCUS</em></h1><p class="subtitle">A Thinking Challenge</p><p class="tagline">See clearly. Think quickly. Adapt instantly.</p><section class="rules" aria-labelledby="rules-title"><div class="rules-head"><span class="eyebrow">THE CHALLENGE</span><h2 id="rules-title">One rule. One clear decision.</h2></div><div class="rulegrid"><article class="rule"><span class="eyebrow">NORMAL</span><h3>Choose the <strong>INK COLOR</strong></h3><p>Ignore the word. Select the color of its letters.</p></article><article class="rule word"><span class="eyebrow">RULE SHIFT</span><h3>Choose the <strong>WORD COLOR</strong></h3><p>Ignore the ink. Select the color the word names.</p></article></div><p class="rule-note">↳ Watch the cue to see which rule is active.</p></section><ul class="facts" aria-label="Challenge facts"><li><b>60 sec</b>challenge</li><li><b>1–6</b>keys or tap</li><li><b>Between rounds</b>rule shifts</li></ul><form id="start-form" novalidate><div class="name-row"><label for="player-name">Player name</label><span id="count">${name.length}/18</span></div><div class="name-controls"><input id="player-name" maxlength="64" value="${esc(name)}" placeholder="Enter player name" autocomplete="nickname" aria-describedby="name-help name-error"><button class="primary" type="submit">START GAME →</button></div><p class="error" id="name-error" role="alert"></p><p class="hint" id="name-help">Use a first name or nickname only. Up to 18 characters.</p></form><section class="practice"><div><h3>Want a warm-up?</h3><p>Five seconds. No score is recorded.</p></div><button class="secondary" data-action="practice">Practice first</button></section><p class="disclaimer">Arcade challenge only. Not an intelligence, medical, psychological, or employee-performance assessment.</p></section><aside class="hero-side-stack"><div class="example"><div class="example-head"><span>Example round</span><span class="live">● Rule shift</span></div><div class="signal"><span class="signal-label">Active rule / word color</span><span class="signal-word">BLUE</span><span class="signal-prompt">Choose the color named by the word</span></div><div class="example-foot"><span><b style="color:var(--ink)">RED INK</b> / choose <b style="color:var(--word)">BLUE</b></span><span class="dots">${Object.values(COLORS).map(c=>`<i style="--c:${c.css}"></i>`).join("")}</span></div></div>${boardHTML(true)}</aside></main><footer class="footer">Flash Focus · Arcade Game</footer></div>`;bind()}
function boardHTML(compact=false){const rows=state.board.slice(0,compact?(state.leaderboardExpanded?10:3):10);return`<section class="board"><div class="board-head"><div><h2>FLASH FOCUS LEADERBOARD</h2><p class="board-note">Scores saved on this device only.</p></div>${compact?`<button class="quiet" data-action="expand">${state.leaderboardExpanded?"Show Top 3":"View Top 10"}</button>`:""}</div>${rows.length?`<table><thead><tr><th>RANK</th><th>PLAYER</th><th>SCORE</th></tr></thead><tbody>${rows.map((e,i)=>`<tr><td class="rank">${String(i+1).padStart(2,"0")}</td><td>${esc(e.name)}</td><td>${e.score.toLocaleString()}</td></tr>`).join("")}</tbody></table>`:`<p class="board-note">No scores yet. Set the first benchmark.</p>`}</section>`}
function start(kind){const n=cleanName(document.querySelector("#player-name")?.value||state.name);if(kind==="game"){const error=nameProblem(n);if(error){const el=document.querySelector("#name-error");if(el)el.textContent=error;return}state.name=n;safeWrite(NAME_KEY,n)}state.session=kind;state.screen="countdown";state.count=3;state.remaining=kind==="practice"?5:60;state.elapsed=0;state.score=state.streak=state.bestStreak=state.total=state.correct=state.incorrect=state.timeouts=state.moments=state.shifts=state.switchAttempts=state.switchCorrect=0;state.reactions=[];state.ruleState={queue:[],last:null,count:0};state.round=null;state.phase="waiting";state.paused=false;state.answerLocked=false;state.feedback="";state.lastAnswer="";state.modal="";state.attempts=[];tone("start");renderCountdown()}
function renderCountdown(){app.innerHTML=`<div class="countdown"><div><p class="eyebrow">${state.session==="practice"?"practice round":"your minute starts now"}</p><div class="countnum">${state.count||"GO"}</div></div></div>`;let c=state.count;const timer=setInterval(()=>{if(state.screen!=="countdown"){clearInterval(timer);return}c--;state.count=c;if(c<=0){clearInterval(timer);state.screen=state.session==="practice"?"practice":"playing";state.remaining=state.session==="practice"?5:60;state.elapsed=0;state.lastTime=performance.now();const r=nextRule();state.round=makeRound(r);state.phase="active";renderGame();tick()}else renderCountdown()},1000)}
function renderGame(){const r=state.round;if(!r)return;const acc=state.total?Math.round(state.correct/state.total*100):0;app.innerHTML=`<div class="shell"><header class="gamebar"><div class="brand"><span class="mark"></span>flash focus</div><div class="stats"><div class="stat score"><span>Score</span><strong>${state.score.toLocaleString()}</strong></div><div class="stat"><span>Streak</span><strong>${state.streak}</strong></div><div class="stat"><span>${tier(state.streak)}</span><strong>${multiplier(state.streak)}×</strong></div><div class="stat"><span>Accuracy</span><strong>${acc}%</strong></div><div class="stat timer"><span>Time remaining</span><strong>${Math.ceil(state.remaining)}s</strong><div class="track"><div class="fill" style="transform:scaleX(${state.remaining/(state.session==="practice"?5:60)})"></div></div></div></div><div class="actions"><button class="icon" data-action="pause" aria-label="${state.paused?"Resume":"Pause"} game">${state.paused?"▶":"Ⅱ"}</button><button class="icon" data-action="restart" aria-label="Restart game">↻</button><button class="icon" data-action="sound" aria-label="Toggle sound">${state.sound?"♪":"×"}</button><button class="icon" data-action="fullscreen" aria-label="Toggle fullscreen">⛶</button><button class="icon" data-action="help" aria-label="How to play">?</button></div></header><main class="playpanel"><div class="roundmeta"><span class="mono muted">${state.session==="practice"?"practice / 05 seconds":`round ${String(state.total+1).padStart(2,"0")}`}</span><span class="rulebadge ${r.shifted?"word":"ink"}"><i></i><strong>${r.shifted?"WORD COLOR":"INK COLOR"}</strong><small>${r.shifted?"Read the word":"See the ink"}</small></span></div><div class="challenge ${state.lastAnswer||""}" aria-live="polite"><span class="word" style="color:${COLORS[r.color].css}">${COLORS[r.word].label.toUpperCase()}</span></div><p class="answer-copy">${r.shifted?"SELECT THE WORD COLOR":"SELECT THE INK COLOR"}</p><div class="answers" role="group" aria-label="Color answers">${r.options.map((c,i)=>`<button class="answer" data-answer="${c}" ${state.phase!=="active"||state.paused?"disabled":""}><i class="swatch" style="--c:${COLORS[c].css}"></i>${i+1}. ${COLORS[c].label}</button>`).join("")}</div><p class="streakline">${state.streak>1?`${state.streak} in a row · ${state.bestStreak} best`:state.bestStreak>2?`${state.bestStreak} best streak`:" "}</p>${state.session==="practice"?'<p class="practice-note">Practice does not count toward your score.</p>':""}</main>${state.paused?`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="pause-title"><span class="eyebrow">game paused</span><h2 id="pause-title">Hold that thought.</h2><p>The clock is stopped. Resume when you’re ready, or press P.</p><div class="actions"><button class="primary" data-action="pause">Resume</button><button class="secondary" data-action="restart">Restart</button></div></section></div>`:""}${state.modal?modalHTML():""}${state.feedback?`<div class="feedback ${state.feedbackKind}" role="status">${esc(state.feedback)}</div>`:""}</div>`;bind()}
function modalHTML(){return`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="help-title"><div class="topbar"><div><span class="eyebrow">quick guide</span><h2 id="help-title">How to Play</h2></div><button class="icon" data-action="close-help" aria-label="Close">×</button></div><p>Follow the active rule. A rule shift can change it between rounds.</p><div class="rulegrid"><article class="rule"><h3>INK COLOR</h3><p>Choose the color of the letters.</p></article><article class="rule word"><h3>WORD COLOR</h3><p>Choose the color named by the word.</p></article></div><ul><li>Tap a color or press its number (1–6).</li><li>Press P to pause or resume.</li><li>Build a streak of 5 or more, then correctly answer a WORD COLOR round for a +50 Focus Moment bonus.</li></ul><p>Flash Focus is inspired by the Stroop effect. It is an arcade game, not an employee-performance, intelligence, medical, psychological, or cognitive assessment.</p><h3>Audio &amp; guidance</h3><div class="setting"><span>Sound effects</span><button class="quiet" data-action="sound">${state.sound?"On":"Off"}</button></div><div class="setting"><span>Voice announcements</span><button class="quiet" data-action="voice">${state.voice?"On":"Off"}</button></div><div class="setting"><span>Coach mode</span><button class="quiet" data-action="coach">${state.coach?"On":"Off"}</button></div><p class="muted">Audio settings are saved on this device. Speech depends on browser support.</p><div class="actions"><button class="primary" data-action="close-help">Got it</button></div></section></div>`}
function tick(){if(state.screen!=="playing"&&state.screen!=="practice")return;const now=performance.now(),delta=(now-state.lastTime)/1000;state.lastTime=now;if(!state.paused){state.elapsed=Math.min(state.session==="practice"?5:60,state.elapsed+delta);state.remaining=Math.max(0,(state.session==="practice"?5:60)-state.elapsed);if(state.phase==="active"&&state.round&&state.elapsed*1000>=state.round.deadline)answer(null,true);if(state.elapsed>=(state.session==="practice"?5:60)){finish();return}}const time=document.querySelector(".timer strong"),fill=document.querySelector(".timer .fill"),accuracy=document.querySelector(".stats .stat:nth-child(4) strong");if(time)time.textContent=`${Math.ceil(state.remaining)}s`;if(fill)fill.style.transform=`scaleX(${state.remaining/(state.session==="practice"?5:60)})`;if(accuracy)accuracy.textContent=`${state.total?Math.round(state.correct/state.total*100):0}%`;setTimeout(tick,80)}
function answer(color,timedOut=false){if(state.phase!=="active"||state.paused||state.answerLocked)return;state.answerLocked=true;const r=state.round,reaction=Math.max(0,state.elapsed*1000-r.promptAt),expected=r.shifted?r.word:r.color,correct=!timedOut&&color===expected;state.phase="resolving";state.lastAnswer=correct?"good":timedOut?"":"bad";if(state.session==="game"){state.total++;if(r.changed&&r.shifted){state.switchAttempts++;if(correct)state.switchCorrect++}if(timedOut){state.timeouts++;state.streak=0}else{state.reactions.push(reaction);if(correct)state.correct++;else{state.incorrect++;state.streak=0}}if(r.shifted)state.shifts++}
 if(state.session==="practice"){tone(timedOut?"timeout":correct?"correct":"incorrect");if(timedOut){state.feedback=`Time’s up — ${r.shifted?"read the word":"choose the ink color"}.`;state.feedbackKind="neutral"}else if(correct){state.feedback=`${Math.round(reaction)} ms · correct`;state.feedbackKind="good"}else{state.feedback="The rule caught you — try the next one.";state.feedbackKind="bad"}if(!correct&&!timedOut)speak("Nice try, stay focused.");else if(timedOut)speak(`Time's up. ${r.shifted?"Read the word":"Choose the ink color"}.`);renderGame();setTimeout(advance,correct?280:650);return}
 let earned=0,focus=false;if(correct){const next=state.streak+1,windowMs=Math.max(1,r.deadline-r.promptAt),speed=Math.max(0,Math.min(15,Math.round(15*(1-reaction/windowMs))));focus=r.shifted&&state.streak>=5;earned=Math.round((10+speed)*multiplier(state.streak))+(focus?50:0);state.score+=earned;state.streak=next;state.bestStreak=Math.max(state.bestStreak,next);if(focus)state.moments++;tone(focus?"moment":"correct");if(focus)speak("Focus moment! You handled the word rule.");state.feedback=focus?"FOCUS MOMENT!\nYou handled the word rule.\n+50 BONUS":`+${earned} · ${Math.round(reaction)} ms`;state.feedbackKind=focus?"moment":"good"}else{tone(timedOut?"timeout":"incorrect");state.feedback=timedOut?"That shift caught you — next one!":"The word won that round.";state.feedbackKind=timedOut?"neutral":"bad";speak(state.feedback)}renderGame();setTimeout(advance,focus?850:correct?280:650)}
function advance(){if(state.screen!=="playing"&&state.screen!=="practice")return;state.feedback="";state.lastAnswer="";state.answerLocked=false;const rule=nextRule();state.round=makeRound(rule);state.phase="active";if(rule.changed){tone("rule");speak(rule.shifted?"Rule shift. Read the word.":"Rule shift. Choose the ink color.",true)}renderGame()}
function finish(){state.screen="results";state.phase="waiting";if(state.session==="practice"){state.modal="practice-complete";renderResults();return}const avg=state.reactions.length?state.reactions.reduce((a,b)=>a+b,0)/state.reactions.length:0,accuracy=state.total?Math.round(state.correct/state.total*100):0,entry={name:state.name,score:state.score,avg,accuracy,bestStreak:state.bestStreak,moments:state.moments,date:new Date().toISOString()},key=entry.name.trim().replace(/\s+/g," ").toLowerCase(),old=state.board.find(e=>e.name.trim().replace(/\s+/g," ").toLowerCase()===key);if(!old||compare(entry,old)<0)state.board=state.board.filter(e=>e.name.trim().replace(/\s+/g," ").toLowerCase()!==key).concat(entry).sort(compare).slice(0,10);safeWrite(BOARD_KEY,JSON.stringify(state.board));renderResults()}
function sessionHonors(rank,avg,accuracy){const titles=[],share=state.correct?state.bestStreak/state.correct:0,switchRate=state.switchAttempts?state.switchCorrect/state.switchAttempts:0;if(state.total>=5&&avg>0&&avg<=650)titles.push(["⚡","Speed Demon","Quick responses across the session."]);if(state.total>=10&&accuracy>=92)titles.push(["🎯","Precision Master","Excellent accuracy throughout the challenge."]);if(state.switchAttempts>=3&&switchRate>=.8)titles.push(["🔄","Adaptability Ace","You adapted quickly when the rule changed."]);if(state.correct>=10&&state.bestStreak>=10&&share>=.5)titles.push(["🔥","Streak Champion","You built and maintained a strong streak."]);if(state.total>=12&&accuracy>=80&&avg>0&&avg<=1000&&state.bestStreak>=5&&share>=.3)titles.push(["🧠","Focus Specialist","You balanced speed, accuracy, and consistency."]);if(rank<=10||(state.total>=12&&state.score>=900&&accuracy>=90&&avg>0&&avg<=800&&state.bestStreak>=10))titles.push(["🏆","Elite Performer","Outstanding all-round performance."]);return titles}
function renderResults(){if(state.session==="practice"){app.innerHTML=`<div class="shell screen"><section class="dialog"><span class="eyebrow">warm-up complete</span><h1>Nice practice.</h1><p>You finished the five-second practice round. No score was recorded.</p><button class="primary" data-action="home">Back to start</button></section></div>`;bind();return}const avg=state.reactions.length?Math.round(state.reactions.reduce((a,b)=>a+b,0)/state.reactions.length):0,accuracy=state.total?Math.round(state.correct/state.total*100):0,title=accuracy>=90&&state.moments>=2&&state.score>=900?"SHARP THINKER":avg>0&&avg<650&&accuracy>=75?"LIGHTNING FOCUS":accuracy>=92?"PRECISION MASTER":state.moments>=2?"ADAPTABILITY ACE":state.bestStreak>=15?"FOCUS MACHINE":accuracy>=80?"CLEAR THINKER":accuracy>=60?"STEADY FOCUS":"FOCUS EXPLORER",rank=state.board.findIndex(e=>e.name.trim().replace(/\s+/g," ").toLowerCase()===state.name.trim().replace(/\s+/g," ").toLowerCase())+1;app.innerHTML=`<div class="shell screen"><header class="topbar"><div class="brand"><span class="mark"></span>flash focus</div><div class="actions"><button class="icon" data-action="help">?</button></div></header><main class="results"><section><span class="eyebrow">session complete / ${esc(state.name)}</span><h1 class="display">${title}</h1><p class="muted">Sixty seconds, done. No labels, no verdicts. Just how you read the signals when they crossed.</p><div class="result-card"><span class="eyebrow">final score</span><div class="bigscore">${state.score.toLocaleString()}</div><div class="result-actions"><button class="primary" data-action="again">Play again</button><button class="secondary" data-action="home">Back to start</button></div></div><section class="result-card"><h2>Why was that difficult?</h2><p class="muted">Reading a word can interfere with naming its ink color, creating a small competition for attention.</p></section><p class="disclaimer">Arcade challenge only. Not an intelligence, medical, psychological, or employee-performance assessment.</p></section><aside class="result-card"><h2>Your readout</h2><div class="metrics"><div class="metric"><strong>${accuracy}%</strong><span>accuracy</span></div><div class="metric"><strong>${avg?avg+" ms":"—"}</strong><span>average reaction</span></div><div class="metric"><strong>${state.correct}</strong><span>correct</span></div><div class="metric"><strong>${state.incorrect}</strong><span>incorrect</span></div><div class="metric"><strong>${state.timeouts}</strong><span>timeouts</span></div><div class="metric"><strong>${state.bestStreak}</strong><span>best streak</span></div><div class="metric"><strong>${state.shifts}</strong><span>word rounds</span></div><div class="metric"><strong>${state.moments}</strong><span>Focus Moments</span></div><div class="metric"><strong>#${rank}</strong><span>local rank</span></div></div><p class="board-note">Leaderboard is stored only in this browser. It is not shared.</p>${boardHTML(false)}<button class="quiet" data-action="remove">Remove my local entry</button></aside></main><footer class="footer">Flash Focus · Arcade Game</footer></div>${state.modal?modalHTML():""}`;bind()}
function pause(){state.paused=!state.paused;state.lastTime=performance.now();renderGame()}
function bind(){
 document.querySelector("#start-form")?.addEventListener("submit",e=>{e.preventDefault();state.name=document.querySelector("#player-name").value;start("game")});
 document.querySelector("#player-name")?.addEventListener("input",e=>{state.name=e.target.value;document.querySelector("#count").textContent=`${cleanName(state.name).length}/18`;document.querySelector("#name-error").textContent=""});
 document.querySelectorAll("[data-answer]").forEach(b=>b.addEventListener("click",()=>answer(b.dataset.answer)));
 document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>action(b.dataset.action)));
 if(state.screen==="results"&&state.session==="game"){
  const scoreCard=document.querySelector(".results .result-card"),avg=state.reactions.length?state.reactions.reduce((a,b)=>a+b,0)/state.reactions.length:0,accuracy=state.total?Math.round(state.correct/state.total*100):0,rank=state.board.findIndex(e=>e.name.trim().replace(/\s+/g," ").toLowerCase()===state.name.trim().replace(/\s+/g," ").toLowerCase())+1,titles=sessionHonors(rank,avg,accuracy);
  if(scoreCard&&!document.querySelector(".honors"))scoreCard.insertAdjacentHTML("afterend",`<section class="result-card honors"><h2>Session honors</h2>${titles.length?titles.map(t=>`<p>${t[0]} <strong>${t[1]}</strong><br><span class="muted">${t[2]}</span></p>`).join(""):'<p class="muted">Play again to unlock a performance title.</p>'}</section>`);
  const rankCell=document.querySelector(".metrics .metric:last-child strong");if(rankCell&&rankCell.textContent==="#0")rankCell.textContent="—";
  const actions=document.querySelector(".shell.screen>.topbar .actions");if(actions&&!actions.querySelector('[data-action="sound"]'))actions.insertAdjacentHTML("afterbegin",`<button class="icon" data-action="sound" aria-label="Toggle sound">${state.sound?"♪":"×"}</button><button class="icon" data-action="fullscreen" aria-label="Toggle fullscreen">⛶</button>`);
 }
 if(state.modal||state.paused){const dialog=document.querySelector(".dialog");dialog?.setAttribute("tabindex","-1");dialog?.focus()}
}
function action(a){if(a==="practice")start("practice");else if(a==="sound"){state.sound=!state.sound;safeWrite(SOUND_KEY,state.sound?"on":"off");state.screen==="home"?renderHome():state.screen==="results"?renderResults():renderGame()}else if(a==="voice"){state.voice=!state.voice;safeWrite(VOICE_KEY,state.voice?"on":"off");renderGame()}else if(a==="coach"){state.coach=!state.coach;safeWrite(COACH_KEY,state.coach?"on":"off");renderGame()}else if(a==="fullscreen"){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch{}}else if(a==="help"){state.modal="help";state.paused=true;state.screen==="home"?renderHome():state.screen==="results"?renderResults():renderGame()}else if(a==="close-help"){state.modal="";state.paused=false;if(state.screen==="playing"||state.screen==="practice")state.lastTime=performance.now();state.screen==="home"?renderHome():state.screen==="results"?renderResults():renderGame()}else if(a==="pause")pause();else if(a==="restart"){if(confirm("Restart this run? Your current score will be lost."))start(state.session)}else if(a==="home"){state.modal="";state.paused=false;state.screen="home";renderHome()}else if(a==="again")start("game");else if(a==="expand"){state.leaderboardExpanded=!state.leaderboardExpanded;renderHome()}else if(a==="remove"){if(confirm("Remove your local leaderboard entry?")){const key=state.name.trim().replace(/\s+/g," ").toLowerCase();state.board=state.board.filter(e=>e.name.trim().replace(/\s+/g," ").toLowerCase()!==key);safeWrite(BOARD_KEY,JSON.stringify(state.board));renderResults()}}}
window.addEventListener("keydown",e=>{if(e.repeat)return;if(e.key==="Escape"){if(state.modal){action("close-help");return}if(state.paused){pause();return}}if(e.key==="Tab"&&(state.modal||state.paused)){const dialog=document.querySelector(".dialog"),items=[...dialog.querySelectorAll("button,input,[href],[tabindex]:not([tabindex='-1'])")].filter(x=>!x.disabled);if(items.length){const first=items[0],last=items.at(-1);if(e.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){e.preventDefault();first.focus()}}return}if(e.target instanceof HTMLInputElement)return;if((state.screen==="playing"||state.screen==="practice")&&!state.modal){if(e.key.toLowerCase()==="p"){pause();return}if(e.key.toLowerCase()==="r"){if(confirm("Restart this run? Your current score will be lost."))start(state.session);return}const i=Number(e.key)-1;if(i>=0&&state.round?.options[i])answer(state.round.options[i])}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&(state.screen==="playing"||state.screen==="practice")&&!state.paused)pause()});
window.addEventListener("blur",()=>{if((state.screen==="playing"||state.screen==="practice")&&!state.paused)pause()});
state.name=safeRead(NAME_KEY,"");state.sound=safeRead(SOUND_KEY,"on")!=="off";state.voice=safeRead(VOICE_KEY,"on")!=="off";state.coach=safeRead(COACH_KEY,"off")==="on";state.board=readBoard();renderHome();
})();
</script>
